<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Data Collector &amp; Briefing Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>Stock Data Collector &amp; Briefing Tool</h1>
            <p class="subtitle">종목코드 6자리를 입력하면 네이버 금융 핵심 지표와 최신 뉴스를 한눈에 수집합니다.</p>
        </header>

        <section class="search-section card">
            <form id="search-form" class="search-form">
                <label for="stock-code-input" class="sr-only">종목코드 6자리</label>
                <input
                    type="text"
                    id="stock-code-input"
                    maxlength="6"
                    placeholder="종목코드 6자리 입력 (예: 000660)"
                    autocomplete="off"
                >
                <button type="submit" id="fetch-btn">데이터 수집</button>
            </form>
            <div class="quick-examples">
                <span>예시 종목:</span>
                <button type="button" class="example-btn" data-code="005930">삼성전자 (005930)</button>
                <button type="button" class="example-btn" data-code="000660">SK하이닉스 (000660)</button>
                <button type="button" class="example-btn" data-code="069500">KODEX 200 (069500)</button>
            </div>
        </section>

        <div id="status-banner" class="status-banner hidden" role="status"></div>

        <main id="result-container" class="result-container hidden">
            <div id="warnings-box" class="warnings-box hidden"></div>

            <!-- 1. 스냅샷 카드 구역 -->
            <section id="snapshot-section" class="card">
                <div class="stock-title-row">
                    <div>
                        <h2 id="stock-name">-</h2>
                        <span id="stock-code-badge" class="code-badge">-</span>
                    </div>
                    <div class="price-box">
                        <span id="current-price" class="current-price">-</span>
                        <span id="change-rate" class="change-rate">-</span>
                    </div>
                </div>

                <div class="metrics-grid">
                    <div class="metric-item">
                        <span class="metric-label">시가총액</span>
                        <strong id="market-cap" class="metric-value">-</strong>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">PER</span>
                        <strong id="per-value" class="metric-value">-</strong>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">PBR</span>
                        <strong id="pbr-value" class="metric-value">-</strong>
                    </div>
                </div>
            </section>

            <!-- 2. 기업실적분석 표 구역 -->
            <section id="financials-section" class="card">
                <div class="section-header">
                    <h3>기업실적분석 (연간)</h3>
                    <span class="section-note">단위: 억원 / % · <span class="badge-consensus">추정(E)</span></span>
                </div>
                <div class="table-wrapper">
                    <table class="financials-table">
                        <thead>
                            <tr>
                                <th>결산연도</th>
                                <th>구분</th>
                                <th>매출액</th>
                                <th>영업이익</th>
                                <th>ROE</th>
                            </tr>
                        </thead>
                        <tbody id="financials-tbody"></tbody>
                    </table>
                </div>
                <p id="financials-empty" class="empty-msg hidden">제공되는 기업실적분석 데이터가 없습니다. (ETF 등)</p>
            </section>

            <!-- 3. 최신 뉴스 리스트 구역 -->
            <section id="news-section" class="card">
                <div class="section-header">
                    <h3>최신 관련 뉴스</h3>
                    <span class="section-note">Serper News API (최대 5건)</span>
                </div>
                <ul id="news-list" class="news-list"></ul>
                <p id="news-empty" class="empty-msg hidden">수집된 관련 뉴스가 없습니다.</p>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
